<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cricket Live Broadcast News Overlay Studio - Pro Edition</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:ital,wght@0,800;0,900;1,800;1,900&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        sports: ['Montserrat', 'sans-serif'],
                    },
                    colors: {
                        cricket: {
                            green: '#00ff66',
                            neon: '#ccff00',
                            gold: '#ffb700',
                            dark: '#050811',
                            card: '#0b1221',
                            accent: '#ff0055'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #050811;
            color: #ffffff;
            background-image: radial-gradient(circle at 50% 0%, rgba(0, 255, 102, 0.08) 0%, transparent 60%);
        }

        .progress-bar-fill {
            transition: width 0.1s linear;
        }

        /* Eye-Catching Broadcast Card Glow */
        .broadcast-card {
            background: linear-gradient(145deg, rgba(13, 22, 40, 0.97), rgba(6, 11, 22, 0.99));
            backdrop-filter: blur(20px);
            border: 2px solid rgba(0, 255, 102, 0.55);
            box-shadow: 0 0 40px rgba(0, 255, 102, 0.18), 0 25px 60px rgba(0, 0, 0, 0.92);
        }

        .slide-enter {
            animation: broadcastReveal 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes broadcastReveal {
            0% {
                opacity: 0;
                transform: translateY(18px) scale(0.97);
            }
            100% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        @keyframes pulseGlow {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.7; transform: scale(1.04); }
        }

        .animate-float {
            animation: floatSlow 3.5s ease-in-out infinite;
        }

        @keyframes floatSlow {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-6px); }
        }

        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between overflow-x-hidden font-sans" onclick="unlockAudioOnInteraction()">

    <!-- EXIT OVERLAY BUTTON (Floating when in Overlay Mode) -->
    <button id="exit-overlay-btn" onclick="toggleOverlayMode()" class="hidden fixed top-4 right-4 z-50 bg-slate-950/95 text-cricket-green border-2 border-cricket-green px-4 py-2 rounded-full font-bold text-xs shadow-2xl hover:bg-slate-800 items-center gap-2">
        <i class="fa-solid fa-compress"></i> Show Admin Panel
    </button>

    <!-- MAIN OVERLAY DISPLAY CONTAINER -->
    <main id="main-layout" class="flex-grow flex items-center justify-center p-3 md:p-6 relative w-full transition-all duration-300 mt-2 mb-2">

        <div id="broadcast-container" class="w-full max-w-5xl transition-all duration-300">

            <!-- EYE-CATCHING BROADCAST NEWS CARD -->
            <div id="slide-card" class="broadcast-card rounded-2xl overflow-hidden slide-enter relative">
                
                <!-- TOP BREAKING TICKER BAR -->
                <div class="bg-gradient-to-r from-red-700 via-slate-950 to-slate-900 px-4 py-3 border-b border-cricket-green/30 flex flex-wrap items-center justify-between gap-2">
                    
                    <div class="flex items-center space-x-2.5">
                        <!-- Live Breaking Pill -->
                        <span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-[11px] font-sports font-black bg-red-600 text-white tracking-widest uppercase shadow-[0_0_15px_rgba(220,38,38,0.8)]">
                            <span class="w-2 h-2 rounded-full bg-white animate-ping"></span> BREAKING LIVE
                        </span>
                        
                        <!-- Category Tag -->
                        <span id="slide-category" class="px-3 py-1 rounded-md text-xs font-sports font-black bg-cricket-green text-black uppercase tracking-wider shadow-[0_0_12px_rgba(0,255,102,0.5)]">
                            PAK VS SL LIVE
                        </span>
                    </div>

                    <!-- Time Ago & Post Counter -->
                    <div class="flex items-center space-x-2.5 text-xs font-mono">
                        <span id="slide-time" class="bg-black/80 text-cricket-gold px-3 py-1 rounded-full border border-cricket-gold/40 font-bold flex items-center gap-1.5">
                            <i class="fa-regular fa-clock animate-spin" style="animation-duration: 10s;"></i> 
                            <span id="time-text">15 Mins Ago</span>
                        </span>
                        <span id="slide-counter" class="bg-cricket-green/15 px-3 py-1 rounded-full border border-cricket-green/50 text-cricket-green font-black">1 / 20</span>
                    </div>
                </div>

                <!-- MAIN CARD BODY -->
                <div id="card-inner-grid" class="grid grid-cols-1 md:grid-cols-12 min-h-[370px]">

                    <!-- LEFT / TOP: DEDICATED TOPIC VISUAL & IMAGE BOX -->
                    <div id="card-media-col" class="md:col-span-5 relative overflow-hidden bg-slate-950 flex items-center justify-center min-h-[250px] md:min-h-full border-b md:border-b-0 md:border-r border-slate-800/90">
                        
                        <!-- Custom Image (If URL provided) OR Custom Animated Topic Graphic -->
                        <img id="slide-custom-img" src="" alt="Cricket News Visual" class="hidden w-full h-full object-cover absolute inset-0 z-10">
                        <div id="slide-svg-container" class="w-full h-full flex items-center justify-center p-2 z-10"></div>

                        <!-- Ambient Glow & Gradient Overlay -->
                        <div class="absolute inset-0 bg-gradient-to-t from-slate-950/90 via-transparent to-slate-950/40 pointer-events-none z-20"></div>
                        
                        <!-- Top Left Live Watermark -->
                        <div class="absolute top-3 left-3 z-30 px-2.5 py-1 bg-black/80 backdrop-blur-md rounded-md border border-cricket-green/40 text-[10px] font-sports font-black tracking-widest text-cricket-green uppercase flex items-center gap-1.5">
                            <span class="w-1.5 h-1.5 rounded-full bg-cricket-green animate-pulse"></span> CRICSTREAM HD
                        </div>

                        <!-- Bottom Topic Tag Inside Visual Box -->
                        <div id="visual-caption" class="absolute bottom-3 left-3 right-3 z-30 px-3 py-1.5 bg-slate-900/90 backdrop-blur-md rounded-lg border border-white/10 text-[11px] font-sports font-bold text-cricket-neon uppercase tracking-wider text-center truncate">
                            MATCH CENTER • LIVE UPDATE
                        </div>
                    </div>

                    <!-- RIGHT / BOTTOM: EYE-CATCHING HEADLINE & ENGAGING STORY -->
                    <div id="card-text-col" class="md:col-span-7 p-5 md:p-7 flex flex-col justify-between bg-gradient-to-br from-slate-900 via-slate-950 to-black relative">
                        
                        <div>
                            <!-- Highlight Eyebrow -->
                            <div class="inline-flex items-center gap-1.5 text-[11px] font-sports font-extrabold text-cricket-gold uppercase tracking-widest mb-2">
                                <i class="fa-solid fa-bolt"></i> TODAY'S TOP CRICKET HEADLINE
                            </div>

                            <!-- High Contrast Headline -->
                            <h2 id="slide-title" class="font-sports font-black text-xl sm:text-2xl md:text-3xl text-white tracking-tight uppercase leading-snug mb-4 drop-shadow">
                                Loading Headline...
                            </h2>

                            <!-- Engaging Readable Story Box -->
                            <div class="bg-slate-900/90 border-l-4 border-cricket-green p-3.5 md:p-4 rounded-r-xl shadow-inner">
                                <p id="slide-body" class="text-slate-100 text-xs sm:text-sm md:text-base leading-relaxed font-medium">
                                    Loading news detailed story...
                                </p>
                            </div>
                        </div>

                        <!-- Footer Verified Source & Viewer Prompt -->
                        <div class="pt-4 mt-5 border-t border-slate-800/90 flex items-center justify-between flex-wrap gap-2">
                            <div class="flex items-center space-x-2 text-cricket-green text-xs font-sports font-bold uppercase tracking-wider">
                                <i class="fa-solid fa-circle-check text-cricket-green text-sm"></i>
                                <span>VERIFIED • 12 NOV 2026</span>
                            </div>

                            <!-- Source Citation Badge -->
                            <div id="slide-source" class="text-xs text-white font-bold bg-slate-800/95 px-3.5 py-1.5 rounded-full border border-cricket-gold/40 flex items-center gap-1.5 shadow">
                                <i class="fa-solid fa-newspaper text-cricket-gold"></i> Source: ICC Official
                            </div>
                        </div>

                    </div>
                </div>

                <!-- 15-SECOND COUNTDOWN PROGRESS BAR -->
                <div class="w-full bg-slate-950 h-2.5 relative overflow-hidden border-t border-slate-800">
                    <div id="progress-bar" class="progress-bar-fill h-full bg-gradient-to-r from-emerald-400 via-cricket-green to-cricket-gold shadow-[0_0_15px_#00ff66]" style="width: 0%;"></div>
                </div>

            </div>

        </div>

    </main>

    <!-- ADMIN DRAWER & POST LIST MANAGEMENT (Hidden in Overlay Mode) -->
    <section id="admin-panel" class="max-w-6xl mx-auto w-full px-3 md:px-6 pb-6">
        <div class="bg-slate-900/95 border border-slate-800 rounded-2xl p-4 space-y-4 shadow-2xl">
            
            <!-- COMPACT CONTROL BAR INSIDE ADMIN PANEL -->
            <div class="flex flex-wrap items-center justify-between gap-2 pb-3 border-b border-slate-800">
                <div class="flex flex-wrap items-center gap-2">
                    <!-- Auto Newsroom Beat Toggle -->
                    <button id="audio-toggle-btn" onclick="toggleAudio()" class="px-3 py-1.5 rounded-lg bg-cricket-green text-black font-bold text-xs flex items-center gap-1.5 shadow-[0_0_10px_rgba(0,255,102,0.4)]">
                        <i id="audio-icon" class="fa-solid fa-volume-high animate-pulse"></i>
                        <span id="audio-status-text">NEWSROOM BEAT ON</span>
                    </button>

                    <!-- Volume Slider -->
                    <input id="volume-slider" type="range" min="0" max="1" step="0.05" value="0.35" oninput="changeVolume(this.value)" class="w-20 accent-cricket-green cursor-pointer">

                    <!-- Track Selector -->
                    <select onchange="changeTrack(this.value)" class="bg-slate-800 border border-slate-700 text-xs text-cricket-green font-bold rounded-lg px-2 py-1.5 focus:outline-none">
                        <option value="newsroom" selected>Newsroom Beat</option>
                        <option value="stadium">Stadium Pulse</option>
                        <option value="hype">Hype Ticker</option>
                    </select>
                </div>

                <div class="flex flex-wrap items-center gap-2">
                    <!-- Timer Buttons (15s Default) -->
                    <div class="flex items-center bg-slate-800 rounded-lg p-1 text-xs">
                        <span class="px-2 text-slate-400 font-semibold">Timer:</span>
                        <button id="btn-timer-10" onclick="setTimer(10)" class="px-2 py-1 rounded text-slate-300 hover:text-white">10s</button>
                        <button id="btn-timer-15" onclick="setTimer(15)" class="px-2 py-1 rounded bg-cricket-green text-black font-bold shadow">15s</button>
                        <button id="btn-timer-20" onclick="setTimer(20)" class="px-2 py-1 rounded text-slate-300 hover:text-white">20s</button>
                    </div>

                    <!-- Play/Pause & Prev/Next -->
                    <button onclick="prevSlide()" class="px-2.5 py-1.5 bg-slate-800 hover:bg-slate-700 rounded-lg text-xs text-white"><i class="fa-solid fa-chevron-left"></i></button>
                    <button onclick="toggleAutoPlay()" class="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 rounded-lg text-xs font-bold text-white flex items-center gap-1">
                        <i id="play-icon" class="fa-solid fa-pause"></i> <span id="play-text">PAUSE</span>
                    </button>
                    <button onclick="nextSlide()" class="px-2.5 py-1.5 bg-slate-800 hover:bg-slate-700 rounded-lg text-xs text-white"><i class="fa-solid fa-chevron-right"></i></button>

                    <!-- Prism Fullscreen Overlay Trigger -->
                    <button onclick="toggleOverlayMode()" class="px-3.5 py-1.5 bg-cricket-green text-black font-sports font-black text-xs rounded-lg shadow-lg hover:brightness-110 flex items-center gap-1.5">
                        <i class="fa-solid fa-expand"></i> PRISM OVERLAY MODE
                    </button>
                </div>
            </div>

            <div class="flex flex-wrap items-center justify-between gap-2">
                <h3 class="font-sports font-bold text-base text-white flex items-center gap-2">
                    <i class="fa-solid fa-list-check text-cricket-green"></i> 
                    Today's 20 Verified Posts (<span id="total-posts-count">20</span>)
                </h3>
                <div class="flex items-center gap-2">
                    <button onclick="openAddModal()" class="text-xs bg-cricket-green text-black font-bold px-3 py-1 rounded-lg">
                        <i class="fa-solid fa-plus mr-1"></i> Add Post
                    </button>
                    <button onclick="resetDefaultNews()" class="text-xs bg-slate-800 hover:bg-slate-700 text-cricket-gold border border-cricket-gold/40 px-3 py-1 rounded-lg">
                        <i class="fa-solid fa-rotate-left mr-1"></i> Reload Today's 20 Posts
                    </button>
                </div>
            </div>

            <!-- News Grid List -->
            <div id="posts-list-container" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-2.5 max-h-64 overflow-y-auto pr-1 no-scrollbar">
                <!-- Dynamically Generated Cards -->
            </div>

        </div>
    </section>

    <!-- ADD/EDIT POST MODAL -->
    <div id="post-modal" class="fixed inset-0 bg-black/85 backdrop-blur-md z-50 hidden flex items-center justify-center p-4">
        <div class="bg-slate-900 border border-slate-700 rounded-2xl max-w-lg w-full p-5 shadow-2xl relative">
            <button onclick="closeModal()" class="absolute top-4 right-4 text-slate-400 hover:text-white text-lg">
                <i class="fa-solid fa-xmark"></i>
            </button>
            
            <h3 id="modal-title" class="font-sports font-bold text-lg text-white mb-4 flex items-center gap-2">
                <i class="fa-solid fa-pen-to-square text-cricket-green"></i> Edit / Add Broadcast Post
            </h3>

            <form id="post-form" onsubmit="handleFormSubmit(event)" class="space-y-3">
                <input type="hidden" id="edit-index" value="-1">
                
                <div>
                    <label class="block text-xs font-semibold text-slate-300 uppercase mb-1">Headline / Title</label>
                    <input type="text" id="input-title" required placeholder="Headline" class="w-full bg-slate-800 border border-slate-700 rounded-lg p-2 text-xs text-white focus:outline-none focus:border-cricket-green">
                </div>

                <div class="grid grid-cols-3 gap-2">
                    <div>
                        <label class="block text-xs font-semibold text-slate-300 uppercase mb-1">Category</label>
                        <input type="text" id="input-category" required placeholder="PAK VS SL" class="w-full bg-slate-800 border border-slate-700 rounded-lg p-2 text-xs text-white focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-300 uppercase mb-1">Time Ago</label>
                        <input type="text" id="input-time" required placeholder="15 Mins Ago" class="w-full bg-slate-800 border border-slate-700 rounded-lg p-2 text-xs text-white focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-300 uppercase mb-1">Source</label>
                        <input type="text" id="input-source" required placeholder="Source: ICC Official" class="w-full bg-slate-800 border border-slate-700 rounded-lg p-2 text-xs text-white focus:outline-none">
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block text-xs font-semibold text-slate-300 uppercase mb-1">Custom Image URL (Optional)</label>
                        <input type="url" id="input-image" placeholder="Leave empty for Built-in Graphic" class="w-full bg-slate-800 border border-slate-700 rounded-lg p-2 text-xs text-white focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-300 uppercase mb-1">Visual Badge Caption</label>
                        <input type="text" id="input-caption" placeholder="e.g. RAWALPINDI TEST" class="w-full bg-slate-800 border border-slate-700 rounded-lg p-2 text-xs text-white focus:outline-none">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-300 uppercase mb-1">Detailed Content</label>
                    <textarea id="input-body" rows="3" required placeholder="Readable story description..." class="w-full bg-slate-800 border border-slate-700 rounded-lg p-2 text-xs text-white focus:outline-none"></textarea>
                </div>

                <div class="flex justify-end gap-2 pt-2">
                    <button type="button" onclick="closeModal()" class="px-3 py-1.5 bg-slate-800 text-slate-300 text-xs font-bold rounded-lg">Cancel</button>
                    <button type="submit" class="px-4 py-1.5 bg-cricket-green text-black text-xs font-sports font-black rounded-lg">Save Post</button>
                </div>
            </form>
        </div>
    </div>

    <!-- SCRIPT ENGINE -->
    <script>
        // DEDICATED TOPIC-SPECIFIC SVG GRAPHIC GENERATOR FOR EACH OF THE 20 POSTS
        function generateTopicGraphic(post) {
            const theme = post.theme || 'match';
            const badge1 = post.badge1 || 'LIVE';
            const badge2 = post.badge2 || 'CRICKET';
            const statText = post.statText || 'VERIFIED UPDATE';

            if (theme === 'vsBattle') {
                return `<svg viewBox="0 0 400 320" class="w-full h-full max-h-72 object-contain animate-float" xmlns="http://www.w3.org/2000/svg">
                    <defs>
                        <linearGradient id="bgVs" x1="0" y1="0" x2="1" y2="1">
                            <stop offset="0%" stop-color="#062c19"/>
                            <stop offset="50%" stop-color="#070b14"/>
                            <stop offset="100%" stop-color="#172554"/>
                        </linearGradient>
                    </defs>
                    <rect width="400" height="320" rx="16" fill="url(#bgVs)"/>
                    <circle cx="200" cy="150" r="105" fill="none" stroke="#00ff66" stroke-width="1.5" stroke-dasharray="6 4" opacity="0.35"/>
                    <!-- Left Team Shield -->
                    <rect x="42" y="95" width="115" height="90" rx="14" fill="#052e16" stroke="#00ff66" stroke-width="2.5"/>
                    <text x="99" y="148" font-family="Montserrat, sans-serif" font-weight="900" font-size="28" fill="#00ff66" text-anchor="middle">${badge1}</text>
                    <!-- VS Emblem -->
                    <circle cx="200" cy="140" r="26" fill="#ff0055" stroke="#ffffff" stroke-width="2"/>
                    <text x="200" y="148" font-family="Montserrat, sans-serif" font-weight="900" font-size="18" fill="#ffffff" text-anchor="middle">VS</text>
                    <!-- Right Team Shield -->
                    <rect x="243" y="95" width="115" height="90" rx="14" fill="#0f172a" stroke="#ffb700" stroke-width="2.5"/>
                    <text x="300" y="148" font-family="Montserrat, sans-serif" font-weight="900" font-size="28" fill="#ffb700" text-anchor="middle">${badge2}</text>
                    <!-- Bottom Telemetry Pill -->
                    <rect x="75" y="215" width="250" height="32" rx="16" fill="rgba(0,255,102,0.14)" stroke="#00ff66" stroke-width="1"/>
                    <text x="200" y="236" font-family="Montserrat, sans-serif" font-weight="800" font-size="12" fill="#ccff00" text-anchor="middle" letter-spacing="1.5">${statText}</text>
                </svg>`;
            }

            if (theme === 'speedFire') {
                return `<svg viewBox="0 0 400 320" class="w-full h-full max-h-72 object-contain animate-float" xmlns="http://www.w3.org/2000/svg">
                    <rect width="400" height="320" rx="16" fill="#080c17"/>
                    <path d="M 50 210 A 150 150 0 0 1 350 210" fill="none" stroke="#1e293b" stroke-width="18" stroke-linecap="round"/>
                    <path d="M 50 210 A 150 150 0 0 1 315 115" fill="none" stroke="#ff0055" stroke-width="18" stroke-linecap="round"/>
                    <circle cx="295" cy="115" r="22" fill="#dc2626" stroke="#ffffff" stroke-width="2.5"/>
                    <path d="M 280 105 Q 295 115 310 125" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-dasharray="3 2"/>
                    <text x="200" y="165" font-family="Montserrat, sans-serif" font-weight="900" font-size="36" fill="#ffffff" text-anchor="middle">${badge1}</text>
                    <text x="200" y="195" font-family="Montserrat, sans-serif" font-weight="800" font-size="14" fill="#00ff66" text-anchor="middle" letter-spacing="2">${badge2}</text>
                    <rect x="80" y="225" width="240" height="30" rx="15" fill="#1e1b4b" stroke="#ff0055" stroke-width="1.5"/>
                    <text x="200" y="245" font-family="Montserrat, sans-serif" font-weight="800" font-size="12" fill="#ffb700" text-anchor="middle">${statText}</text>
                </svg>`;
            }

            if (theme === 'trophyGold') {
                return `<svg viewBox="0 0 400 320" class="w-full h-full max-h-72 object-contain animate-float" xmlns="http://www.w3.org/2000/svg">
                    <rect width="400" height="320" rx="16" fill="#070b14"/>
                    <circle cx="200" cy="135" r="95" fill="rgba(255,183,0,0.08)" stroke="#ffb700" stroke-width="2" stroke-dasharray="5 3"/>
                    <path d="M 155 75 L 245 75 L 232 150 Q 200 182 168 150 Z" fill="#ffb700"/>
                    <path d="M 188 150 L 212 150 L 218 192 L 182 192 Z" fill="#d97706"/>
                    <rect x="155" y="192" width="90" height="24" rx="4" fill="#0f172a" stroke="#ffb700" stroke-width="1.5"/>
                    <path d="M 145 88 Q 122 110 156 132" fill="none" stroke="#ffb700" stroke-width="5"/>
                    <path d="M 255 88 Q 278 110 244 132" fill="none" stroke="#ffb700" stroke-width="5"/>
                    <text x="200" y="128" font-family="Montserrat, sans-serif" font-weight="900" font-size="18" fill="#070b14" text-anchor="middle">${badge1}</text>
                    <text x="200" y="245" font-family="Montserrat, sans-serif" font-weight="900" font-size="15" fill="#00ff66" text-anchor="middle" letter-spacing="1.5">${statText}</text>
                </svg>`;
            }

            if (theme === 'rankingsChart') {
                return `<svg viewBox="0 0 400 320" class="w-full h-full max-h-72 object-contain animate-float" xmlns="http://www.w3.org/2000/svg">
                    <rect width="400" height="320" rx="16" fill="#070b14"/>
                    <rect x="85" y="155" width="58" height="75" rx="6" fill="#1e293b" stroke="#64748b" stroke-width="2"/>
                    <rect x="171" y="90" width="58" height="140" rx="6" fill="#052e16" stroke="#00ff66" stroke-width="2.5"/>
                    <rect x="257" y="125" width="58" height="105" rx="6" fill="#1e293b" stroke="#ffb700" stroke-width="2"/>
                    <text x="114" y="195" font-family="Montserrat, sans-serif" font-weight="900" font-size="20" fill="#94a3b8" text-anchor="middle">#3</text>
                    <text x="200" y="135" font-family="Montserrat, sans-serif" font-weight="900" font-size="26" fill="#00ff66" text-anchor="middle">#1</text>
                    <text x="286" y="170" font-family="Montserrat, sans-serif" font-weight="900" font-size="20" fill="#ffb700" text-anchor="middle">#2</text>
                    <text x="200" y="65" font-family="Montserrat, sans-serif" font-weight="900" font-size="16" fill="#ccff00" text-anchor="middle">${badge1} • ${badge2}</text>

        /* ==========================================================================
           WEB AUDIO API - AUTO NEWSROOM BEAT SYNTHESIZER
           ========================================================================== */
        let audioCtx = null;
        let isAudioMuted = false;
        let masterGain = null;
        let beatInterval = null;
        let currentTrack = 'newsroom';
        let beatStep = 0;

        function initAudioContext() {
            if (!audioCtx) {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                audioCtx = new AudioContext();
                masterGain = audioCtx.createGain();
                const slider = document.getElementById('volume-slider');
                masterGain.gain.value = slider ? parseFloat(slider.value) : 0.35;
                masterGain.connect(audioCtx.destination);
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function unlockAudioOnInteraction() {
            if (!isAudioMuted) {
                initAudioContext();
                if (!beatInterval) {
                    startSynthesizerBeat();
                }
            }
        }

        function toggleAudio() {
            initAudioContext();
            isAudioMuted = !isAudioMuted;
            const toggleBtn = document.getElementById('audio-toggle-btn');
            const icon = document.getElementById('audio-icon');
            const text = document.getElementById('audio-status-text');

            if (!isAudioMuted) {
                toggleBtn.className = "px-3 py-1.5 rounded-lg bg-cricket-green text-black font-bold text-xs flex items-center gap-1.5 shadow-[0_0_10px_rgba(0,255,102,0.4)]";
                icon.className = "fa-solid fa-volume-high animate-pulse";
                text.innerText = "NEWSROOM BEAT ON";
                startSynthesizerBeat();
            } else {
                toggleBtn.className = "px-3 py-1.5 rounded-lg bg-slate-700 text-slate-300 hover:text-white font-bold text-xs flex items-center gap-1.5";
                icon.className = "fa-solid fa-volume-xmark text-slate-400";
                text.innerText = "BEAT MUTED";
                stopSynthesizerBeat();
            }
        }

        function changeVolume(val) {
            if (masterGain && audioCtx) {
                masterGain.gain.setValueAtTime(parseFloat(val), audioCtx.currentTime);
            }
        }

        function changeTrack(val) {
            currentTrack = val;
            beatStep = 0;
        }

        function playTransitionBeep() {
            if (isAudioMuted || !audioCtx || audioCtx.state !== 'running') return;
            try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(523.25, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(1046.50, audioCtx.currentTime + 0.12);

                gain.gain.setValueAtTime(0.22, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.12);

                osc.connect(gain);
                gain.connect(masterGain);

                osc.start();
                osc.stop(audioCtx.currentTime + 0.12);
            } catch (e) {}
        }

        function startSynthesizerBeat() {
            stopSynthesizerBeat();
            beatStep = 0;
            const bpm = 120;
            const stepDuration = (60 / bpm) / 4 * 1000;

            beatInterval = setInterval(() => {
                if (isAudioMuted || !audioCtx || audioCtx.state !== 'running') return;
                playBeatStep(beatStep);
                beatStep = (beatStep + 1) % 16;
            }, stepDuration);
        }

        function stopSynthesizerBeat() {
            if (beatInterval) {
                clearInterval(beatInterval);
                beatInterval = null;
            }
        }

        function playBeatStep(step) {
            const now = audioCtx.currentTime;

            if (step % 4 === 0) {
                const kick = audioCtx.createOscillator();
                const kickGain = audioCtx.createGain();
                kick.frequency.setValueAtTime(currentTrack === 'hype' ? 120 : 92, now);
                kick.frequency.exponentialRampToValueAtTime(30, now + 0.08);

                kickGain.gain.setValueAtTime(0.45, now);
                kickGain.gain.exponentialRampToValueAtTime(0.001, now + 0.08);

                kick.connect(kickGain);
                kickGain.connect(masterGain);
                kick.start(now);
                kick.stop(now + 0.08);
            }

            if (step === 4 || step === 12) {
                const tick = audioCtx.createOscillator();
                const tickGain = audioCtx.createGain();
                tick.type = 'square';
                tick.frequency.setValueAtTime(currentTrack === 'stadium' ? 320 : 220, now);

                tickGain.gain.setValueAtTime(0.1, now);
                tickGain.gain.exponentialRampToValueAtTime(0.001, now + 0.05);

                tick.connect(tickGain);
                tickGain.connect(masterGain);
                tick.start(now);
                tick.stop(now + 0.05);
            }

            const synthScale = currentTrack === 'stadium' ? [261.63, 329.63, 392.00, 523.25] : [220.00, 261.63, 329.63, 440.00];
            if (step % 2 === 0 && (currentTrack === 'newsroom' || step % 4 !== 0)) {
                const note = synthScale[(step / 2) % synthScale.length];
                const synth = audioCtx.createOscillator();
                const synthGain = audioCtx.createGain();

                synth.type = currentTrack === 'hype' ? 'sawtooth' : 'sine';
                synth.frequency.setValueAtTime(note, now);

                synthGain.gain.setValueAtTime(0.07, now);
                synthGain.gain.exponentialRampToValueAtTime(0.001, now + 0.1);

                synth.connect(synthGain);
                synthGain.connect(masterGain);
                synth.start(now);
                synth.stop(now + 0.1);
            }
        }

        // Slider Loop Engine (15 Seconds Default)
        function startAutoSlider() {
            stopAutoSlider();
            elapsedProgress = 0;
            updateProgressBar(0);

            const intervalStep = 100;
            
            progressInterval = setInterval(() => {
                if (isPlaying) {
                    elapsedProgress += intervalStep;
                    let percentage = (elapsedProgress / (timerSeconds * 1000)) * 100;
                    updateProgressBar(percentage);

                    if (elapsedProgress >= timerSeconds * 1000) {
                        nextSlide();
                        elapsedProgress = 0;
                    }
                }
            }, intervalStep);
        }

        function stopAutoSlider() {
            if (progressInterval) clearInterval(progressInterval);
        }

        function updateProgressBar(percentage) {
            const bar = document.getElementById('progress-bar');
            if (bar) bar.style.width = `${Math.min(percentage, 100)}%`;
        }

            const post = newsPosts[currentIndex];

            slideCard.classList.remove('slide-enter');

            document.getElementById('slide-title').innerText = post.title;

            document.getElementById('time-text').innerText = post.time || 'Just Now';
            document.getElementById('slide-body').innerText = post.body;
            document.getElementById('slide-source').innerHTML = `<i class="fa-solid fa-newspaper text-cricket-gold mr-1"></i> ${post.source || 'Source: ICC Official'}`;

            // Handle Custom Image URL OR Topic-Specific Animated Graphic
            const customImg = document.getElementById('slide-custom-img');
            const svgContainer = document.getElementById('slide-svg-container');

            if (post.image && post.image.trim() !== "") {
                customImg.src = post.image;
                customImg.classList.remove('hidden');
                svgContainer.classList.add('hidden');
                customImg.onerror = function() {
                    customImg.classList.add('hidden');

                };
            } else {
                customImg.classList.add('hidden');
                svgContainer.classList.remove('hidden');
                svgContainer.innerHTML = generateTopicGraphic(post);

            document.getElementById('slide-counter').innerText = `${currentIndex + 1} / ${newsPosts.length}`;
            highlightActiveAdminCard();

        // Navigation Controls
        function nextSlide() {
            if (newsPosts.length === 0) return;
            currentIndex = (currentIndex + 1) % newsPosts.length;
            renderCurrentSlide();
            elapsedProgress = 0;

        function prevSlide() {
            if (newsPosts.length === 0) return;
            currentIndex = (currentIndex - 1 + newsPosts.length) % newsPosts.length;
            renderCurrentSlide();

        }

        function jumpToSlide(index) {

        }

        function resetDefaultNews() {
            if (confirm("Reset post list to today's 20 verified cricket news stories?")) {
                newsPosts = [...todaysTop20CricketPosts];
                currentIndex = 0;
                saveAndRefresh();
            }
        }

        // Add / Edit Post Modal
        function openAddModal() {
            document.getElementById('edit-index').value = "-1";
            document.getElementById('modal-title').innerText = "Add Broadcast Post";
            document.getElementById('post-form').reset();
            document.getElementById('post-modal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('post-modal').classList.add('hidden');
        }

        function editPost(index) {
            const post = newsPosts[index];
            document.getElementById('edit-index').value = index;
            document.getElementById('modal-title').innerText = "Edit Broadcast Post";
            
            document.getElementById('input-title').value = post.title;
            document.getElementById('input-category').value = post.category;
            document.getElementById('input-time').value = post.time;
            document.getElementById('input-source').value = post.source || 'Source: ICC Official';
            document.getElementById('input-image').value = post.image || '';
            document.getElementById('input-caption').value = post.caption || '';
            document.getElementById('input-body').value = post.body;

            document.getElementById('post-modal').classList.remove('hidden');
        }

        function deletePost(index) {
            if (newsPosts.length <= 1) {
                alert("At least one broadcast post must remain.");
                return;
            }
            newsPosts.splice(index, 1);
            if (currentIndex >= newsPosts.length) currentIndex = 0;
            saveAndRefresh();
        }

        function handleFormSubmit(e) {
            e.preventDefault();
            const editIndex = parseInt(document.getElementById('edit-index').value);
            const existingPost = editIndex >= 0 ? newsPosts[editIndex] : {};

            const newPost = {
                ...existingPost,
                title: document.getElementById('input-title').value,
                category: document.getElementById('input-category').value,
                time: document.getElementById('input-time').value || 'Just Now',
                source: document.getElementById('input-source').value || 'Source: ICC Official',
                image: document.getElementById('input-image').value.trim(),
                caption: document.getElementById('input-caption').value || 'MATCH CENTER • LIVE UPDATE',
                body: document.getElementById('input-body').value
            };

            if (editIndex >= 0) {
                newsPosts[editIndex] = newPost;
            } else {
                newPost.theme = 'vsBattle';
                newPost.badge1 = 'LIVE';
                newPost.badge2 = 'NEWS';
                newPost.statText = 'BREAKING CRICKET UPDATE';
                newsPosts.unshift(newPost);
                currentIndex = 0;
            }

            saveAndRefresh();
            closeModal();
        }

        function saveAndRefresh() {
            localStorage.setItem('cric_news_posts_pro20_v1', JSON.stringify(newsPosts));
            renderCurrentSlide();
            renderAdminPostsList();
            elapsedProgress = 0;
        }
    </script>
</body>
</html>
