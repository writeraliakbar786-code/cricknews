<html lang="en">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:ital,wght@0,800;0,900;1,800;1,900&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        sports: ['Montserrat', 'sans-serif'],
                    },
                    colors: {
                        cricket: {
                            green: '#00ff66',
                            neon: '#ccff00',
                            gold: '#ffb700',
                            dark: '#070b14',
                            card: '#0f172a',
                            accent: '#ff0055'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        /* Smooth animations & Broadcast styling */
        body {
            background-color: #070b14;
            color: #ffffff;
        }

        .progress-bar-fill {
            transition: width 0.1s linear;
        }

        .glass-card {
            background: rgba(15, 23, 42, 0.94);
            backdrop-filter: blur(16px);
            border: 2px solid rgba(0, 255, 102, 0.35);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.85);
        }

        .slide-enter {
            animation: slideInRight 0.45s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes slideInRight {
            from {
                opacity: 0;
                transform: translateX(35px) scale(0.98);
            }
            to {
                opacity: 1;
                transform: translateX(0) scale(1);
            }
        }

        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between overflow-x-hidden font-sans">

    <!-- TOP CONTROL BAR (Hidden in Overlay Mode) -->

    <!-- EXIT OVERLAY BUTTON (Floating when in Overlay Mode) -->
    <button id="exit-overlay-btn" onclick="toggleOverlayMode()" class="hidden fixed top-4 right-4 z-50 bg-slate-900/95 text-cricket-green border-2 border-cricket-green px-4 py-2 rounded-full font-bold text-xs shadow-2xl hover:bg-slate-800 items-center gap-2">
        <i class="fa-solid fa-compress"></i> Show Admin Panel
    </button>

    <!-- MAIN OVERLAY DISPLAY CONTAINER -->
    <main id="main-layout" class="flex-grow flex items-center justify-center p-6 md:p-6 relative w-full transition-all duration-300 mt-6 mb-6 ">

        <div id="broadcast-container" class="w-full max-w-5xl transition-all duration-300">

            <!-- NEWS DISPLAY CARD -->
            <div id="slide-card" class="glass-card rounded-2xl overflow-hidden slide-enter relative">
                
                <!-- TOP HEADER TICKER & TIME AGO -->
                <div class="bg-gradient-to-r from-slate-950 via-slate-900 to-slate-950 px-4 py-3 border-b border-slate-800 flex flex-wrap items-center justify-between gap-2">
                    
                    <div class="flex items-center space-x-2">
                        <!-- Live Pulse -->
                        <span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-[11px] font-sports font-black bg-red-600 text-white tracking-widest uppercase">
                            <span class="w-2 h-2 rounded-full bg-white animate-ping"></span> LIVE TICKER
                        </span>
                        
                        <!-- Category Tag -->
                        <span id="slide-category" class="px-3 py-1 rounded-md text-xs font-sports font-extrabold bg-cricket-green text-black uppercase tracking-wider shadow">
                            OFFICIAL ICC
                        </span>
                    </div>

                    <!-- Slide Counter & Time Ago Tag -->
                    <div class="flex items-center space-x-3 text-xs text-slate-300 font-mono">
                        <span id="slide-time" class="bg-slate-800/90 text-cricket-gold px-2.5 py-1 rounded border border-slate-700 font-bold flex items-center gap-1">
                            <i class="fa-regular fa-clock"></i> <span id="time-text">2 Hours Ago</span>
                        </span>
                        <span id="slide-counter" class="bg-slate-800/90 px-2.5 py-1 rounded border border-slate-700 text-cricket-green font-bold">1 / 30</span>
                    </div>
                </div>

                <!-- MAIN CARD BODY (GRID LAYOUT) -->
                <div id="card-inner-grid" class="grid grid-cols-1 md:grid-cols-12 min-h-[340px]">

                    <!-- Left: Featured Graphic / Photo -->
                    <div id="card-media-col" class="md:col-span-5 relative overflow-hidden bg-slate-950 flex items-center justify-center min-h-[220px] md:min-h-full">
                        <!-- Dynamic SVG Graphic Container -->
                        <div id="slide-svg-container" class="w-full h-full flex items-center justify-center p-4"></div>
                        <div class="absolute inset-0 bg-gradient-to-t from-slate-950 via-transparent to-transparent md:bg-gradient-to-r md:from-transparent md:to-slate-950 pointer-events-none"></div>
                        
                        <!-- Streaming Badge Overlay -->
                        <div class="absolute top-3 left-3 px-2 py-0.5 bg-black/70 backdrop-blur-md rounded border border-white/20 text-[10px] font-sports font-bold tracking-widest text-cricket-green uppercase">
                            CricStream HD
                        </div>
                    </div>

                    <!-- Right: Content details -->
                    <div id="card-text-col" class="md:col-span-7 p-4 md:p-6 flex flex-col justify-between bg-gradient-to-br from-slate-900 to-slate-950">
                        
                        <div>
                            <!-- Headline -->
                            <h2 id="slide-title" class="font-sports font-black text-xl md:text-3xl text-white tracking-wide uppercase leading-tight mb-3 text-transparent bg-clip-text bg-gradient-to-r from-white via-slate-100 to-slate-200">
                                Loading Headline...
                            </h2>

                            <!-- Readable Content -->
                            <p id="slide-body" class="text-slate-300 text-xs md:text-sm leading-relaxed border-l-2 border-cricket-green pl-3.5 py-1 bg-slate-800/40 rounded-r-lg font-normal">
                                Loading news detailed story...
                            </p>
                        </div>

                        <!-- Footer Verified Source Badge -->
                        <div class="pt-3 mt-4 border-t border-slate-800/80 flex items-center justify-between flex-wrap gap-2">
                            <div class="flex items-center space-x-1.5 text-cricket-green text-xs font-semibold uppercase tracking-wider">
                                <i class="fa-solid fa-circle-check text-cricket-green"></i>
                                <span>VERIFIED UPDATE</span>
                            </div>

                            <!-- Source Citation Tag -->
                            <div id="slide-source" class="text-[11px] text-slate-300 font-bold bg-slate-800 px-3 py-1 rounded-full border border-slate-700 flex items-center gap-1">
                                <i class="fa-solid fa-newspaper text-cricket-gold"></i> Source: ICC Official
                            </div>
                        </div>

                    </div>
                </div>

                <!-- PROGRESS BAR -->
                <div class="w-full bg-slate-950 h-2 relative overflow-hidden border-t border-slate-800">
                    <div id="progress-bar" class="progress-bar-fill h-full bg-gradient-to-r from-emerald-400 via-cricket-green to-cricket-gold shadow-[0_0_12px_#00ff66]" style="width: 0%;"></div>
                </div>

            </div>

        </div>

    </main>

    <!-- ADMIN DRAWER & POST LIST MANAGEMENT (Hidden in Overlay Mode) -->
    <section id="admin-panel" class="max-w-6xl mx-auto w-full px-3 md:px-6 pb-6">
        <div class="bg-slate-900/90 border border-slate-800 rounded-2xl p-4">
            
            <div class="flex flex-wrap items-center justify-between mb-3 gap-2">
                <h3 class="font-sports font-bold text-base text-white flex items-center gap-2">
                    <i class="fa-solid fa-list-check text-cricket-green"></i> 
                    Manage Broadcast Posts (<span id="total-posts-count">30</span>)
                </h3>
                <div class="flex items-center gap-2">
                    <button onclick="resetDefaultNews()" class="text-xs bg-slate-800 hover:bg-slate-700 text-cricket-gold border border-cricket-gold/40 px-3 py-1 rounded-lg">
                        <i class="fa-solid fa-rotate-left mr-1"></i> Reload 30 Default ICC News
                    </button>
                    <span class="text-xs text-slate-400">Click post to jump directly</span>
                </div>
            </div>

            <!-- News Grid List -->
            <div id="posts-list-container" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-2.5 max-h-64 overflow-y-auto pr-1 no-scrollbar">
                <!-- Dynamically Generated Cards -->
            </div>

        </div>
    </section>

    <!-- ADD/EDIT POST MODAL -->
    <div id="post-modal" class="fixed inset-0 bg-black/85 backdrop-blur-md z-50 hidden flex items-center justify-center p-4">
        <div class="bg-slate-900 border border-slate-700 rounded-2xl max-w-lg w-full p-5 shadow-2xl relative">
            <button onclick="closeModal()" class="absolute top-4 right-4 text-slate-400 hover:text-white text-lg">
                <i class="fa-solid fa-xmark"></i>
            </button>
            
            <h3 id="modal-title" class="font-sports font-bold text-lg text-white mb-4 flex items-center gap-2">
                <i class="fa-solid fa-pen-to-square text-cricket-green"></i> Add Broadcast Post
            </h3>

            <form id="post-form" onsubmit="handleFormSubmit(event)" class="space-y-3">
                <input type="hidden" id="edit-index" value="-1">
                
                <div>
                    <label class="block text-xs font-semibold text-slate-300 uppercase mb-1">Headline / Title</label>
                    <input type="text" id="input-title" required placeholder="Title" class="w-full bg-slate-800 border border-slate-700 rounded-lg p-2 text-xs text-white focus:outline-none focus:border-cricket-green">
                </div>

                <div class="grid grid-cols-3 gap-2">
                    <div>
                        <label class="block text-xs font-semibold text-slate-300 uppercase mb-1">Category</label>
                        <input type="text" id="input-category" required placeholder="OFFICIAL ICC" class="w-full bg-slate-800 border border-slate-700 rounded-lg p-2 text-xs text-white focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-300 uppercase mb-1">Time Ago</label>
                        <input type="text" id="input-time" required placeholder="2 Hours Ago" class="w-full bg-slate-800 border border-slate-700 rounded-lg p-2 text-xs text-white focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-300 uppercase mb-1">Source</label>
                        <input type="text" id="input-source" required placeholder="Source: ICC Official" class="w-full bg-slate-800 border border-slate-700 rounded-lg p-2 text-xs text-white focus:outline-none">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-300 uppercase mb-1">Image URL</label>
                    <input type="url" id="input-image" required placeholder="https://images.unsplash.com/..." class="w-full bg-slate-800 border border-slate-700 rounded-lg p-2 text-xs text-white focus:outline-none">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-300 uppercase mb-1">Detailed Content</label>
                    <textarea id="input-body" rows="3" required placeholder="Readable story description..." class="w-full bg-slate-800 border border-slate-700 rounded-lg p-2 text-xs text-white focus:outline-none"></textarea>
                </div>

                <div class="flex justify-end gap-2 pt-2">
                    <button type="button" onclick="closeModal()" class="px-3 py-1.5 bg-slate-800 text-slate-300 text-xs font-bold rounded-lg">Cancel</button>
                    <button type="submit" class="px-4 py-1.5 bg-cricket-green text-black text-xs font-sports font-black rounded-lg">Save Post</button>
                </div>
            </form>
        </div>
    </div>

            {

                graphicType: "trophy",

        // State Variables
        let newsPosts = JSON.parse(localStorage.getItem('cric_news_posts_v2')) || default30CricketPosts;
        let currentIndex = 0;
        let timerSeconds = 10;
        let elapsedProgress = 0;
        let isPlaying = true;
        let progressInterval = null;
        let isOverlayMode = false;

        /* ==========================================================================
           WEB AUDIO API - COPYRIGHT FREE SPORTS NEWS SOUND SYNTHESIZER
           ========================================================================== */
        let audioCtx = null;
        let isAudioMuted = true;
        let masterGain = null;
        let beatInterval = null;
        let currentTrack = 'newsroom';
        let beatStep = 0;

        function initAudioContext() {
            if (!audioCtx) {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                audioCtx = new AudioContext();
                masterGain = audioCtx.createGain();
                masterGain.gain.value = parseFloat(document.getElementById('volume-slider').value) || 0.3;
                masterGain.connect(audioCtx.destination);
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function toggleAudio() {
            initAudioContext();
            isAudioMuted = !isAudioMuted;
            const toggleBtn = document.getElementById('audio-toggle-btn');
            const icon = document.getElementById('audio-icon');
            const text = document.getElementById('audio-status-text');

            if (!isAudioMuted) {
                toggleBtn.className = "px-2.5 py-1 rounded bg-cricket-green text-black font-bold flex items-center gap-1.5 shadow-[0_0_10px_rgba(0,255,102,0.5)] transition";
                icon.className = "fa-solid fa-volume-high text-black animate-pulse";
                text.innerText = "AUDIO ON";
                startSynthesizerBeat();
            } else {
                toggleBtn.className = "px-2.5 py-1 rounded bg-slate-700 text-slate-300 hover:text-white font-bold flex items-center gap-1.5 transition";
                icon.className = "fa-solid fa-volume-xmark text-slate-400";
                text.innerText = "AUDIO OFF";
                stopSynthesizerBeat();
            }
        }

        function changeVolume(val) {
            if (masterGain && audioCtx) {
                masterGain.gain.setValueAtTime(parseFloat(val), audioCtx.currentTime);
            }
        }

        function changeTrack(val) {
            currentTrack = val;
            beatStep = 0;
        }

        // Plays short engaging sound effect on slide toggle
        function playTransitionBeep() {
            if (isAudioMuted || !audioCtx) return;
            try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(523.25, audioCtx.currentTime); // C5
                osc.frequency.exponentialRampToValueAtTime(1046.50, audioCtx.currentTime + 0.12); // C6

                gain.gain.setValueAtTime(0.25, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.12);

                osc.connect(gain);
                gain.connect(masterGain);

                osc.start();
                osc.stop(audioCtx.currentTime + 0.12);
            } catch (e) {
                console.error("Audio beep error", e);
            }
        }

        // Dynamic Sound Beat Generator (Sine/Square Synth Engine)
        function startSynthesizerBeat() {
            stopSynthesizerBeat();
            beatStep = 0;
            const bpm = 120;
            const stepDuration = (60 / bpm) / 4 * 1000; // 16th notes

            beatInterval = setInterval(() => {
                if (isAudioMuted || !audioCtx) return;
                playBeatStep(beatStep);
                beatStep = (beatStep + 1) % 16;
            }, stepDuration);
        }

        function stopSynthesizerBeat() {
            if (beatInterval) clearInterval(beatInterval);
        }

        function playBeatStep(step) {
            const now = audioCtx.currentTime;

            // Kick Drum (Pulse on steps 0, 4, 8, 12)
            if (step % 4 === 0) {
                const kick = audioCtx.createOscillator();
                const kickGain = audioCtx.createGain();
                kick.frequency.setValueAtTime(currentTrack === 'hype' ? 120 : 90, now);
                kick.frequency.exponentialRampToValueAtTime(30, now + 0.08);

                kickGain.gain.setValueAtTime(0.5, now);
                kickGain.gain.exponentialRampToValueAtTime(0.001, now + 0.08);

                kick.connect(kickGain);
                kickGain.connect(masterGain);
                kick.start(now);
                kick.stop(now + 0.08);
            }

            // Snare / Tick (Steps 4, 12)
            if (step === 4 || step === 12) {
                const tick = audioCtx.createOscillator();
                const tickGain = audioCtx.createGain();
                tick.type = 'square';
                tick.frequency.setValueAtTime(currentTrack === 'stadium' ? 320 : 220, now);

                tickGain.gain.setValueAtTime(0.12, now);
                tickGain.gain.exponentialRampToValueAtTime(0.001, now + 0.05);

                tick.connect(tickGain);
                tickGain.connect(masterGain);
                tick.start(now);
                tick.stop(now + 0.05);
            }

            // News Ticker Melody Synth
            const synthScale = currentTrack === 'stadium' ? [261.63, 329.63, 392.00, 523.25] : [220.00, 261.63, 329.63, 440.00];
            if (step % 2 === 0 && (currentTrack === 'newsroom' || step % 4 !== 0)) {
                const note = synthScale[(step / 2) % synthScale.length];
                const synth = audioCtx.createOscillator();
                const synthGain = audioCtx.createGain();

                synth.type = currentTrack === 'hype' ? 'sawtooth' : 'sine';
                synth.frequency.setValueAtTime(note, now);

                synthGain.gain.setValueAtTime(0.08, now);
                synthGain.gain.exponentialRampToValueAtTime(0.001, now + 0.1);

                synth.connect(synthGain);
                synthGain.connect(masterGain);
                synth.start(now);
                synth.stop(now + 0.1);
            }
        }

        // Window Init
        window.onload = function () {
            renderCurrentSlide();
            renderAdminPostsList();
            startAutoSlider();
        };

        // Slider Loop Engine
        function startAutoSlider() {
            stopAutoSlider();
            elapsedProgress = 0;
            updateProgressBar(0);

            const intervalStep = 100;
            
            progressInterval = setInterval(() => {
                if (isPlaying) {
                    elapsedProgress += intervalStep;
                    let percentage = (elapsedProgress / (timerSeconds * 1000)) * 100;
                    updateProgressBar(percentage);

                    if (elapsedProgress >= timerSeconds * 1000) {
                        nextSlide();
                        elapsedProgress = 0;
                    }
                }
            }, intervalStep);
        }

        function stopAutoSlider() {
            if (progressInterval) clearInterval(progressInterval);
        }

        function updateProgressBar(percentage) {
            const bar = document.getElementById('progress-bar');
            if (bar) bar.style.width = `${Math.min(percentage, 100)}%`;
        }

        // Render Slide Content
        function renderCurrentSlide() {
            if (newsPosts.length === 0) return;

            // Trigger Transition Sound Effect
            playTransitionBeep();

            const post = newsPosts[currentIndex];
            const slideCard = document.getElementById('slide-card');

            // Trigger Animation
            slideCard.classList.remove('slide-enter');
            void slideCard.offsetWidth;
            slideCard.classList.add('slide-enter');

            // Set Data
            document.getElementById('slide-title').innerText = post.title;
            document.getElementById('slide-category').innerText = post.category || 'ICC NEWS';
            document.getElementById('time-text').innerText = post.time || 'Recently';
            document.getElementById('slide-body').innerText = post.body;
            document.getElementById('slide-source').innerHTML = `<i class="fa-solid fa-newspaper text-cricket-gold mr-1"></i> ${post.source || 'Source: ICC Official'}`;

            // Render Custom SVG Graphic
            const svgContainer = document.getElementById('slide-svg-container');
            const graphicType = post.graphicType || 'batBall';
            svgContainer.innerHTML = cricketGraphicSVGs[graphicType] || cricketGraphicSVGs['batBall'];

            document.getElementById('slide-counter').innerText = `${currentIndex + 1} / ${newsPosts.length}`;
            highlightActiveAdminCard();
        }

        // Navigation Controls
        function nextSlide() {
            if (newsPosts.length === 0) return;
            currentIndex = (currentIndex + 1) % newsPosts.length;
            renderCurrentSlide();
            elapsedProgress = 0;
        }

        function prevSlide() {
            if (newsPosts.length === 0) return;
            currentIndex = (currentIndex - 1 + newsPosts.length) % newsPosts.length;
            renderCurrentSlide();
            elapsedProgress = 0;
        }

        function jumpToSlide(index) {
            currentIndex = index;
            renderCurrentSlide();
            elapsedProgress = 0;
        }

        function toggleAutoPlay() {
            isPlaying = !isPlaying;
            const playIcon = document.getElementById('play-icon');
            const playText = document.getElementById('play-text');

            if (isPlaying) {
                playIcon.className = "fa-solid fa-pause";
                playText.innerText = "PAUSE";
            } else {
                playIcon.className = "fa-solid fa-play";
                playText.innerText = "PLAY";
            }
        }

        function setTimer(seconds) {
            timerSeconds = seconds;
            [5, 10, 15, 20].forEach(s => {
                const btn = document.getElementById(`btn-timer-${s}`);
                if (btn) {
                    btn.className = s === seconds 
                        ? "px-2 py-1 rounded bg-cricket-green text-black font-bold shadow" 
                        : "px-2 py-1 rounded text-slate-300 hover:text-white";
                }
            });
            elapsedProgress = 0;
            startAutoSlider();
        }

        // Overlay Presets Selector
        function changePreset(preset) {
            const container = document.getElementById('broadcast-container');
            const innerGrid = document.getElementById('card-inner-grid');
            const mediaCol = document.getElementById('card-media-col');
            const textCol = document.getElementById('card-text-col');

            // Reset layout classes
            container.className = "w-full transition-all duration-300";
            innerGrid.className = "grid grid-cols-1 md:grid-cols-12 min-h-[340px]";
            mediaCol.className = "md:col-span-5 relative overflow-hidden bg-slate-950 flex items-center justify-center min-h-[200px] md:min-h-full";
            textCol.className = "md:col-span-7 p-4 md:p-6 flex flex-col justify-between bg-gradient-to-br from-slate-900 to-slate-950";

            if (preset === 'bottom') {
                container.classList.add('max-w-6xl', 'mt-auto');
                innerGrid.className = "grid grid-cols-1 md:grid-cols-12 min-h-[240px]";
                mediaCol.className = "hidden md:flex md:col-span-3 relative overflow-hidden bg-slate-950";
                textCol.className = "md:col-span-9 p-4 flex flex-col justify-between bg-slate-900";
            } else if (preset === 'side') {
                container.classList.add('max-w-md');
                innerGrid.className = "flex flex-col min-h-[400px]";
                mediaCol.className = "w-full h-48 relative overflow-hidden bg-slate-950";
                textCol.className = "w-full p-4 flex flex-col justify-between bg-slate-900";
            } else {
                container.classList.add('max-w-5xl');
            }
        }

        // PRISM Live Overlay View Mode Toggle
        function toggleOverlayMode() {
            isOverlayMode = !isOverlayMode;
            const topBar = document.getElementById('top-bar');
            const adminPanel = document.getElementById('admin-panel');
            const exitBtn = document.getElementById('exit-overlay-btn');
            const mainLayout = document.getElementById('main-layout');

            if (isOverlayMode) {
                topBar.classList.add('hidden');
                adminPanel.classList.add('hidden');
                exitBtn.classList.remove('hidden');
                exitBtn.classList.add('flex');
                mainLayout.classList.add('h-screen', 'p-0');
            } else {
                topBar.classList.remove('hidden');
                adminPanel.classList.remove('hidden');
                exitBtn.classList.add('hidden');
                exitBtn.classList.remove('flex');
                mainLayout.classList.remove('h-screen', 'p-0');
            }
        }

        // Admin Grid Drawer Render
        function renderAdminPostsList() {
            const container = document.getElementById('posts-list-container');
            document.getElementById('total-posts-count').innerText = newsPosts.length;
            container.innerHTML = '';

            newsPosts.forEach((post, index) => {
                const card = document.createElement('div');
                card.className = `p-2.5 rounded-xl border transition cursor-pointer flex items-center justify-between gap-2 ${index === currentIndex ? 'bg-slate-800 border-cricket-green' : 'bg-slate-900/80 border-slate-800 hover:border-slate-700'}`;
                card.onclick = () => jumpToSlide(index);

                card.innerHTML = `
                    <div class="flex items-center space-x-2.5 overflow-hidden">
                        <img src="${post.image}" class="w-10 h-10 rounded-lg object-cover flex-shrink-0" onerror="this.src='https://placehold.co/100/0f172a/00ff66?text=Cric'">
                        <div class="truncate">
                            <h4 class="text-xs font-bold text-white truncate">${post.title}</h4>
                            <div class="flex items-center gap-2 text-[10px]">
                                <span class="text-cricket-green font-semibold">${post.category}</span>
                                <span class="text-slate-400">• ${post.time}</span>
                            </div>
                        </div>
                    </div>
                    <div class="flex items-center space-x-1 flex-shrink-0">
                        <button onclick="event.stopPropagation(); editPost(${index})" class="p-1 text-slate-400 hover:text-white"><i class="fa-solid fa-pen text-xs"></i></button>
                        <button onclick="event.stopPropagation(); deletePost(${index})" class="p-1 text-slate-400 hover:text-red-400"><i class="fa-solid fa-trash text-xs"></i></button>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function highlightActiveAdminCard() {
            renderAdminPostsList();
        }

        function resetDefaultNews() {
            if (confirm("Reset post list to 30 authentic ICC news stories?")) {
                newsPosts = [...default30CricketPosts];
                currentIndex = 0;
                saveAndRefresh();
            }
        }

        // Add / Edit Post Modal
        function openAddModal() {
            document.getElementById('edit-index').value = "-1";
            document.getElementById('modal-title').innerText = "Add Broadcast Post";
            document.getElementById('post-form').reset();
            document.getElementById('post-modal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('post-modal').classList.add('hidden');
        }

        function editPost(index) {
            const post = newsPosts[index];
            document.getElementById('edit-index').value = index;
            document.getElementById('modal-title').innerText = "Edit Broadcast Post";
            
            document.getElementById('input-title').value = post.title;
            document.getElementById('input-category').value = post.category;
            document.getElementById('input-time').value = post.time;
            document.getElementById('input-source').value = post.source || 'Source: ICC Official';
            document.getElementById('input-image').value = post.image;
            document.getElementById('input-body').value = post.body;

            document.getElementById('post-modal').classList.remove('hidden');
        }

        function deletePost(index) {
            if (newsPosts.length <= 1) {
                alert("At least one broadcast post must remain.");
                return;
            }
            newsPosts.splice(index, 1);
            if (currentIndex >= newsPosts.length) currentIndex = 0;
            saveAndRefresh();
        }

        function handleFormSubmit(e) {
            e.preventDefault();
            const editIndex = parseInt(document.getElementById('edit-index').value);

            const newPost = {
                title: document.getElementById('input-title').value,
                category: document.getElementById('input-category').value,
                time: document.getElementById('input-time').value || 'Just Now',
                source: document.getElementById('input-source').value || 'Source: ICC Official',
                image: document.getElementById('input-image').value,
                body: document.getElementById('input-body').value
            };

            if (editIndex >= 0) {
                newsPosts[editIndex] = newPost;
            } else {
                newsPosts.unshift(newPost);
                currentIndex = 0;
            }

            saveAndRefresh();
            closeModal();
        }

        function saveAndRefresh() {
            localStorage.setItem('cric_news_posts_v2', JSON.stringify(newsPosts));
            renderCurrentSlide();
            renderAdminPostsList();
            elapsedProgress = 0;
        }
    </script>
